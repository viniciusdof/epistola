name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: nightly
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      sha: ${{ steps.check.outputs.sha }}
      git_date: ${{ steps.check.outputs.git_date }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "git_date=$(git log -1 --date=format:%Y-%m-%d --format=%cd "$head_sha")" >> "$GITHUB_OUTPUT"

          existing="$(git tag --points-at HEAD --list 'nightly-*')"
          if [ -n "$existing" ]; then
            echo "$head_sha already has a nightly tag ($existing); skipping build."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=nightly-$(date -u +%Y-%m-%d)-${head_sha:0:7}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.should_run == 'true'
    env:
      EPISTOLA_CHANNEL: nightly
      EPISTOLA_GIT_SHA: ${{ needs.check-for-changes.outputs.sha }}
      EPISTOLA_GIT_DATE: ${{ needs.check-for-changes.outputs.git_date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
          - os: macos-latest
            platform: macos
            arch: aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: windows-11-arm
            platform: windows
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-for-changes.outputs.sha }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake lld llvm \
            libasound2-dev libfontconfig-dev libglib2.0-dev \
            libssl-dev libva-dev libvulkan1 libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev

      - uses: jdx/mise-action@v4
        if: matrix.platform != 'windows'
        with:
          install: false
      - if: matrix.platform != 'windows'
        run: mise install rust just

      - uses: dtolnay/rust-toolchain@master
        if: matrix.platform == 'windows'
        with:
          toolchain: "1.97.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Build release binaries (Linux/macOS)
        if: matrix.platform != 'windows'
        run: just build-release

      - name: Build release binaries (Windows)
        if: matrix.platform == 'windows'
        run: cargo build --release -p epistola-cli -p epistola-gui

      - name: Sanity-check --version reflects the nightly channel
        if: matrix.platform == 'linux'
        run: target/release/epistola --version | grep -q nightly

      - name: Set nightly package version
        run: |
          compact_date="${EPISTOLA_GIT_DATE//-/}"
          short_sha="${EPISTOLA_GIT_SHA:0:7}"
          version="0.0.0-nightly.${compact_date}.g${short_sha}"
          sed -i.bak "s/^version = .*/version = \"$version\"/" packager.toml
          rm -f packager.toml.bak

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Generate shell completions
        if: matrix.platform == 'linux'
        run: |
          mkdir -p completions
          target/release/epistola completions bash > completions/epistola.bash
          target/release/epistola completions zsh > completions/epistola.zsh
          target/release/epistola completions fish > completions/epistola.fish

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: cargo packager --release -f deb,appimage,pacman -c packager.toml

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: cargo packager --release -f app,dmg -c packager.toml

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: cargo packager --release -f nsis -c packager.toml

      - name: Collect packaged artifacts
        run: |
          mkdir -p dist
          find target/release/packages -maxdepth 1 -type f -exec cp {} dist/ \;

      - uses: actions/upload-artifact@v7
        with:
          name: epistola-nightly-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check-for-changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-for-changes.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the nightly tag
        run: |
          git tag "${{ needs.check-for-changes.outputs.tag_name }}" "${{ needs.check-for-changes.outputs.sha }}"
          git push origin "${{ needs.check-for-changes.outputs.tag_name }}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-for-changes.outputs.tag_name }}
          name: ${{ needs.check-for-changes.outputs.tag_name }}
          prerelease: true
          draft: true
          target_commitish: ${{ needs.check-for-changes.outputs.sha }}
          body: |
            Automated nightly build from commit ${{ needs.check-for-changes.outputs.sha }}. Unstable — expect breakage and reverted features.
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.check-for-changes.outputs.tag_name }}" --draft=false --repo ${{ github.repository }}

      - name: Publish nightly release on Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          SHA: ${{ needs.check-for-changes.outputs.sha }}
          TAG_NAME: ${{ needs.check-for-changes.outputs.tag_name }}
        run: bash .github/scripts/publish-codeberg-release.sh
