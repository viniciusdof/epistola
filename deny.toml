[graph]
all-features = true

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste, unmaintained, pulled in transitively by gpui
    "RUSTSEC-2026-0173", # proc-macro-error2, unmaintained, pulled in transitively by gpui
    "RUSTSEC-2026-0192", # ttf-parser, unmaintained, pulled in transitively by gpui
    "RUSTSEC-2026-0206", # rustybuzz, unmaintained, pulled in transitively by gpui
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "NCSA",
    "bzip2-1.0.6",
    # GPL-3.0-or-later: transitive via gpui -> sum_tree -> ztracing/zlog (Zed's
    # own logging crates). Confirmed acceptable for now.
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/wgpu.git",
]
