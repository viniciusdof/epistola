[package]
name = "epistola-engine"
description = "Orchestration/use-case layer for epistola: resolves, executes, and manages saved requests, environments, folders, and history on top of epistola-core/-format/-http."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
epistola-core.workspace = true
epistola-http.workspace = true
epistola-format.workspace = true
thiserror.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["parsing", "serde-well-known"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
tokio.workspace = true

[lints]
workspace = true
