[package]
name = "epistola-cli"
description = "epistola's command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "epistola"
path = "src/main.rs"

[dependencies]
epistola-core.workspace = true
epistola-http.workspace = true
epistola-format.workspace = true
tokio.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.103"
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints]
workspace = true
