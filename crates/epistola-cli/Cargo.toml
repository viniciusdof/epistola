[package]
name = "epistola-cli"
description = "ϵpistola's command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "epistola"
path = "src/main.rs"

[dependencies]
epistola-core.workspace = true
epistola-format.workspace = true
epistola-engine.workspace = true
