[package]
name = "epistola-gui"
description = "GPUI-based desktop client for epistola"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "epistola-gui"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.10.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.10.3", features = [
    "font-kit",
    "wayland",
] }
epistola-core.workspace = true
epistola-format.workspace = true
epistola-engine.workspace = true
async-compat = "0.2.5"
rust-embed.workspace = true
time = "0.3.53"
unicode-segmentation = "1.13.3"
nucleo-matcher = "0.3.1"
notify = "8.2.0"
async-channel = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.11"

[lints]
workspace = true

[package.metadata.bundle]
name = "Epistola"
identifier = "dev.epistola.gui"
icon = ["resources/icon.svg", "resources/icon.icns", "resources/icon.ico", "resources/icon.png"]
short_description = "GPUI-based desktop client for epistola"
category = "Developer Tool"
osx_minimum_system_version = "11.0"
