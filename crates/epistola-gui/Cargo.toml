[package]
name = "epistola-gui"
description = "Prototype GPUI-based desktop client for epistola"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "epistola-gui"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.10.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.10.3", features = [
    "font-kit",
] }
epistola-core.workspace = true
epistola-format.workspace = true
epistola-engine.workspace = true
async-compat = "0.2.5"
rust-embed.workspace = true
time = "0.3.53"
unicode-segmentation = "1.13.3"
nucleo-matcher = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
